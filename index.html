<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="main">
      <!--"choose as you like" HAS to stay-->
      <button id="mainFolderSelect">choose as you like</button>
      <div id="gallery"></div>
    </div>
    <div id ="menu"> 
      <div id="windowBtns">
        <button id="minimizeBtn">─</button>
        <button id="closeBtn">✕</button>
      </div>

      <button id ='menuFolderSelect'>choose as you like</button>
      <div id ='sliders'>

        <div id = floatSliderWrapper>
         <label id="sliderTitles">Float Speed</label>
          <input type="range" id="floatSpeedSlider" min="0" max="20" step="1" value="5"></input>
          <span id="floatSpeedValue"></span>
        </div>

        <div id = imgLifespanWrapper>
          <label id="sliderTitles">Image Lifespan</label>
          <input type="range" id="imgLifespanSlider" min="500" max="60000" step="500" value="1"></input>
          <span id="imgLifespanValue"></span>
        </div>

        <div id = imgNumSliderWrapper>
        <label id="sliderTitles">Number of Images</label>
         <input type="range" id="imgNumSlider" min="0" max="20" step="2" value="5"></input>
         <span id="imgNumValue"></span>
        </div>

        <div id='imgSizeWrapper'>
         <label id ="sliderTitles">Image Size</label>
         <input type ="range" id ="imgSizeSlider" min ="1" max = "3" step="1" value ="2"></input>
         <span id="imgSizeValue"></span>
        </div>
      </div>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
